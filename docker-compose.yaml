services:
  # PostgreSQL database
  postgres:
    image: postgres:14-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    command: [ "postgres", "-c", "wal_level=logical" ]
    networks:
      - lakehouse-net

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - lakehouse-net

  # Kafka broker
  broker:
    image: confluentinc/cp-kafka:7.3.0
    container_name: broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9102:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - lakehouse-net

  # Debezium CDC connector
  connect:
    build:
      context: ./connect
    container_name: connect
    ports:
      - "8083:8083"
    depends_on:
      - broker
      - postgres
      - schema-registry
    environment:
      CONNECT_BOOTSTRAP_SERVERS: broker:29092
      CONNECT_GROUP_ID: cdc-lakehouse-connect
      CONNECT_CONFIG_STORAGE_TOPIC: cdc_lakehouse_connect_configs
      CONNECT_OFFSET_STORAGE_TOPIC: cdc_lakehouse_connect_offsets
      CONNECT_STATUS_STORAGE_TOPIC: cdc_lakehouse_connect_statuses
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
    networks:
      - lakehouse-net

  # Schema Registry for Avro CDC and schema evolution demos
  schema-registry:
    image: confluentinc/cp-schema-registry:7.3.0
    container_name: schema-registry
    depends_on:
      - broker
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: broker:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - lakehouse-net

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /tmp/data --console-address ":9001"
    networks:
      - lakehouse-net

  # Iceberg REST catalog shared by Spark writers and Trino readers
  iceberg-rest:
    image: tabulario/iceberg-rest:1.4.2
    container_name: iceberg-rest
    depends_on:
      - minio
      - minio-init
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://lakehouse/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    networks:
      - lakehouse-net

  # Spark master
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./:/app
    networks:
      - lakehouse-net

  # Spark worker
  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    volumes:
      - ./:/app
    networks:
      - lakehouse-net

  # Trino SQL engine
  trino:
    image: trinodb/trino:435
    container_name: trino
    ports:
      - "8085:8085"
    volumes:
      - ./trino/config.properties:/etc/trino/config.properties
      - ./trino/node.properties:/etc/trino/node.properties
      - ./trino/jvm.config:/etc/trino/jvm.config
      - ./trino/catalog:/etc/trino/catalog
    depends_on:
      - minio
      - iceberg-rest
    networks:
      - lakehouse-net

  # Airflow orchestration UI for connector registration and platform checks
  airflow:
    image: apache/airflow:2.8.1
    container_name: airflow
    command: standalone
    ports:
      - "8088:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/airflow/project
    depends_on:
      - connect
      - schema-registry
      - iceberg-rest
    networks:
      - lakehouse-net

  # Prometheus metrics backend
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - platform-exporter
    networks:
      - lakehouse-net

  # Grafana dashboard for platform health
  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - lakehouse-net

  # Custom exporter for portfolio-friendly CDC platform health metrics
  platform-exporter:
    build:
      context: ./observability
    container_name: platform-exporter
    ports:
      - "9108:9108"
    environment:
      CONNECT_URL: http://connect:8083
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      ICEBERG_REST_URL: http://iceberg-rest:8181
    depends_on:
      - connect
      - schema-registry
      - iceberg-rest
    networks:
      - lakehouse-net

  # Create MinIO bucket on startup
  minio-init:
    image: minio/mc
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c " sleep 5; mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; mc mb myminio/lakehouse --ignore-existing; mc anonymous set public myminio/lakehouse; echo 'Bucket lakehouse created successfully'; exit 0; "
    networks:
      - lakehouse-net

networks:
  lakehouse-net:
    driver: bridge
